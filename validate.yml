# Runs on every pull request: rejects entries that break the schema or use unknown tags.
name: Validate catalog entries
on:
  pull_request:
    paths: ["data/**", "scripts/**", "site/**"]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python scripts/build_catalog.py --check   # report appears on the Actions run page
